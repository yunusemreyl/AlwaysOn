[package]
name = "always_on"
version = "1.1.0"
edition = "2021"
authors = ["Yunus Emre Yilmaz <yunusemreyl>"]
description = "Lightweight Windows system tray utility to prevent system sleep and screen lock"
repository = "https://github.com/yunusemreyl/AlwaysOn"
license = "MIT"

[dependencies]
windows = { version = "0.58.0", features = [
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security"
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = false
